"120" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="160" x2="1548.0" y2="160" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="200" x2="1548.0" y2="200" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="240" x2="1548.0" y2="240" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="280" x2="1548.0" y2="280" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="320" x2="1548.0" y2="320" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="360" x2="1548.0" y2="360" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="400" x2="1548.0" y2="400" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="440" x2="1548.0" y2="440" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="480" x2="1548.0" y2="480" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="520" x2="1548.0" y2="520" stroke="#f0f0f0" stroke-width="1"/><line x1="-14.0" y1="560" x2="1548.0" y2="560" stroke="#f0f0f0" stroke-width="1"/><rect x="40" y="150" width="220" height="110" rx="0" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.4"/><text x="150" y="181" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="150" y="191">① 写镜头表</tspan><tspan x="150" y="207">锁画风 · 色板 · 角色</tspan><tspan x="150" y="223">每行：物/动作/镜头/屏上字</tspan></text><rect x="290" y="150" width="220" height="110" rx="0" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.4"/><text x="400" y="181" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="400" y="191">② storyboard_lint</tspan><tspan x="400" y="207">红灯不许写码</tspan><tspan x="400" y="223">--script 核对口播数字</tspan></text><rect x="540" y="150" width="220" height="110" rx="0" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.4"/><text x="650" y="181" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="650" y="191">③ 逐镜渲染</tspan><tspan x="650" y="207">--spec / --solo</tspan><tspan x="650" y="223">每镜 镜NN.mp4</tspan></text><rect x="790" y="150" width="220" height="110" rx="0" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.4"/><text x="900" y="181" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="900" y="191">④ ffmpeg 拼接</tspan><tspan x="900" y="207">concat 硬切 · 可选混音</tspan><tspan x="900" y="223">或整片 scenes 一次出</tspan></text><rect x="1040" y="150" width="220" height="110" rx="0" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.4"/><text x="1150" y="181" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="1150" y="191">⑤ qa 验收</tspan><tspan x="1150" y="207">确定性/动感/流畅/框景</tspan><tspan x="1150" y="223">+ 独立审片 agent</tspan></text><rect x="1290" y="150" width="220" height="110" rx="0" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.4"/><text x="1400" y="181" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="1400" y="191">⑥ deliver.py</tspan><tspan x="1400" y="207">先过 film_gate 门禁</tspan><tspan x="1400" y="223">绿/黄灯才复制成片</tspan></text><rect x="40" y="330" width="1480" height="200" rx="6" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="8,5"/><text x="780" y="332" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#555555" font-weight="normal" ><tspan x="780" y="347">交付门禁 · film_gate（deliver.py 先跑）</tspan></text><rect x="70" y="398" width="330" height="84" rx="0" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/><text x="235" y="416" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="235" y="426">🚦 红灯 ①</tspan><tspan x="235" y="442">快速运动帧占比 &lt; 0.035</tspan><tspan x="235" y="458">（&lt; 0.06 为黄灯）</tspan></text><rect x="435" y="398" width="330" height="84" rx="0" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/><text x="600" y="416" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="600" y="426">🚦 红灯 ②</tspan><tspan x="600" y="442">成片中段连续 ≥ 0.3s</tspan><tspan x="600" y="458">空画面 / 近乎纯色（给时间码）</tspan></text><rect x="800" y="398" width="330" height="84" rx="0" fill="#FFEBEE" stroke="#C62828" stroke-width="1.4"/><text x="965" y="416" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="965" y="426">🚦 红灯 ③</tspan><tspan x="965" y="442">蓝紫底帧 ≥ 30%</tspan><tspan x="965" y="458">--allow-blue-purple 降黄</tspan></text><rect x="1165" y="398" width="330" height="84" rx="0" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.4"/><text x="1330" y="416" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" ><tspan x="1330" y="426">✅ 绿/黄灯 · 交付</tspan><tspan x="1330" y="442">复制成片 + 写 交付说明.md</tspan><tspan x="1330" y="458">事实段指纹 · --verify 校验</tspan></text><text x="780" y="12" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#1a1a1a" font-weight="normal" ><tspan x="780" y="27">轨道档交付工作流 · 六步 + 三条红旗门禁</tspan></text><text x="150" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#888888" font-weight="normal" ><tspan x="150" y="275">每镜 2–6s · 文字镜 ≤30% · 开场是具体小场景</tspan></text><text x="400" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#888888" font-weight="normal" ><tspan x="400" y="275">红灯：画风锁缺失/文字墙/连续三镜推近</tspan></text><text x="650" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#888888" font-weight="normal" ><tspan x="650" y="275">同宽高同 fps · 单片段 ≤8s · 一镜 ≤2 种语法</tspan></text><text x="900" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#888888" font-weight="normal" ><tspan x="900" y="275">同衬底同 fps · 混音 --shortest</tspan></text><text x="1150" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#888888" font-weight="normal" ><tspan x="1150" y="275">2s 内单调推拉横移记镜头事件 · 审片写 &lt;项目&gt;/审片/</tspan></text><text x="1400" y="266" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#888888" font-weight="normal" ><tspan x="1400" y="275">红灯不复制成片 · 非零退出</tspan></text><text x="670" y="503" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#C62828" font-weight="normal" ><tspan x="670" y="512">红灯不交付 → 照打印的修法改完重渲、重跑 qa；qa.py 交付前先跑；独立审片结论须写 &lt;项目&gt;/审片/*.md</tspan></text><path d="M 260 205 L 290 205" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arw)"/><path d="M 510 205 L 540 205" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arw)"/><path d="M 760 205 L 790 205" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arw)"/><path d="M 1010 205 L 1040 205" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arw)"/><path d="M 1260 205 L 1290 205" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arw)"/><path d="M 400 150 L 400 130 L 150 130 L 150 150" fill="none" stroke="#C62828" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arw)"/><rect x="194" y="120" width="161" height="20" fill="#ffffff" opacity="0.92" stroke="none"/><text x="275" y="123" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#333333" font-weight="normal" ><tspan x="275" y="132">红灯 → 改镜头表重跑</tspan></text><path d="M 1400 260 L 1400 295 L 780 295 L 780 330" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arw)"/><rect x="990" y="285" width="200" height="20" fill="#ffffff" opacity="0.92" stroke="none"/><text x="1090" y="288" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#333333" font-weight="normal" ><tspan x="1090" y="297">跑 film_gate 门禁</tspan></text></svg>
      <text x="598" y="944" font-size="38" font-weight="600" fill="#6B655B">1  上次学新东西</text>
      <text x="598" y="1012" font-size="38" font-weight="600" fill="#6B655B">2  周末在充电吗</text>
      <text x="598" y="1070" font-size="38" font-weight="600" fill="#6B655B">3  十年后的底气</text>

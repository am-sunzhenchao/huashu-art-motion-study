      <rect x="72" y="796" width="446" height="74" fill="#1B1A17"/>
      <text x="296" y="848" font-size="38" font-weight="700" fill="#FBF8F2" text-anchor="middle">对孩子的要求</text>
      <text x="108" y="944" font-size="38" font-weight="600" fill="#1B1A17">1  现在踏实学好</text>
      <text x="108" y="1012" font-size="38" font-weight="600" fill="#1B1A17">2  周末多刷题</text>
      <text x="108" y="1070" font-size="38" font-weight="600" fill="#1B1A17">3  排满补习班</text>
    </g>


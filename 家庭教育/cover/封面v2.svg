<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <radialGradient id="vig2" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </radialGradient>
    <filter id="cardShade2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="10" flood-color="#1B1A17" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="#F3EDE2"/>
  <rect width="1080" height="1440" fill="#F3EDE2" filter="url(#grain2)"/>

  <path d="M0 300 Q 240 352 520 322 T 1080 266" stroke="#C8402F" stroke-width="7" fill="none" opacity="0.92"/>
  <circle cx="520" cy="330" r="13" fill="#C8402F"/>
  <circle cx="1044" cy="268" r="13" fill="#C8402F"/>


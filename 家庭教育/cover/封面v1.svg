<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="cardShade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="7" stdDeviation="10" flood-color="#1B1A17" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="#F3EDE2"/>
  <rect width="1080" height="1440" fill="#F3EDE2" filter="url(#paperGrain)"/>

  <rect x="0" y="0" width="1080" height="18" fill="#C8402F"/>

  <g font-family="PingFang SC, Noto Sans SC, Heiti SC" >


    <text x="84" y="286" font-size="104" font-weight="800" fill="#1B1A17" letter-spacing="2">你每天催孩子学习</text>
    <text x="84" y="412" font-size="104" font-weight="800" fill="#1B1A17" letter-spacing="2">那你自己呢？</text>

    <rect x="84" y="446" width="520" height="22" fill="#C8402F" opacity="0.28"/>

    <g filter="url(#cardShade)">
      <rect x="72" y="548" width="420" height="330" rx="14" fill="#FBF8F2"/>
      <rect x="72" y="548" width="420" height="78" rx="14" fill="#1B1A17"/>
      <rect x="72" y="596" width="420" height="30" fill="#1B1A17"/>
      <text x="282" y="602" font-size="42" font-weight="700" fill="#FBF8F2" text-anchor="middle">我们要求孩子</text>
      <text x="108" y="702" font-size="40" font-weight="600" fill="#1B1A17">1  踏实学好功课</text>
      <text x="108" y="774" font-size="40" font-weight="600" fill="#1B1A17">2  周末多刷题</text>
      <text x="108" y="846" font-size="40" font-weight="600" fill="#1B1A17">3  排满各类补习</text>
    </g>

    <g filter="url(#cardShade)">
      <rect x="588" y="548" width="420" height="330" rx="14" fill="#FBF8F2"/>
      <rect x="588" y="548" width="420" height="78" rx="14" fill="#C8402F"/>
      <rect x="588" y="596" width="420" height="30" fill="#C8402F"/>
      <text x="798" y="602" font-size="42" font-weight="700" fill="#FBF8F2" text-anchor="middle">我们自己呢</text>
      <text x="624" y="702" font-size="40" font-weight="600" fill="#6B655B">1  上次学新东西</text>
      <text x="624" y="774" font-size="40" font-weight="600" fill="#6B655B">2  周末在充电吗</text>
      <text x="624" y="846" font-size="40" font-weight="600" fill="#6B655B">3  十年后的底气</text>
    </g>

    <text x="540" y="968" font-size="56" font-weight="800" fill="#2F5D62" text-anchor="middle">?</text>

    <g filter="url(#cardShade)">
      <rect x="72" y="1012" width="936" height="268" rx="16" fill="#FBF8F2"/>
      <rect x="72" y="1012" width="14" height="268" fill="#C8402F"/>
      <text x="130" y="1120" font-size="62" font-weight="800" fill="#1B1A17">孩子很少照着你说的道理活</text>
      <text x="130" y="1218" font-size="62" font-weight="800" fill="#C8402F">他照着你的样子长大</text>
    </g>


  </g>
</svg>
